<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarketFarmer — offline</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f6f8f7;
             font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; color:#1f2a30; }
      main { text-align:center; padding:32px; max-width:34rem; }
      img { width:72px; height:72px; border-radius:18px; }
      h1 { font-size:20px; margin:20px 0 8px; }
      p { margin:0 0 20px; font-size:14px; line-height:1.6; color:#5b6a72; }
      button { border:0; border-radius:9px; padding:11px 20px; font:inherit; font-weight:700;
               background:#30347d; color:#fff; cursor:pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>MarketFarmer needs a connection to load your leads. The app itself is installed and ready — it will pick up where you left off as soon as you are back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
